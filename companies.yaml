# Boards to poll. One entry per company.
#
#   ats:   greenhouse | lever | ashby
#   slug:  the company's board identifier (NOT its domain)
#   name:  whatever you want to see in the digest
#
# The slug is the last path segment of the company's public careers board:
#   https://boards.greenhouse.io/<slug>        -> ats: greenhouse
#   https://jobs.lever.co/<slug>               -> ats: lever
#   https://jobs.ashbyhq.com/<slug>            -> ats: ashby
#
# THESE ARE EXAMPLES — verify each one before you trust the output. Companies
# migrate between ATS vendors and slugs go dead. Check a slug in your browser:
#   https://boards-api.greenhouse.io/v1/boards/<slug>/jobs?content=true
#   https://api.lever.co/v0/postings/<slug>?mode=json
#   https://api.ashbyhq.com/posting-api/job-board/<slug>?includeCompensation=true
#
# A dead slug is not fatal: fetch_board prints the HTTP status and returns [],
# so one bad entry never takes down the run. Watch the per-board job counts on
# stdout — a board reporting 0 jobs every day is a slug that needs fixing.
#
# Start with 10-15 companies you would actually join. A list of 200 is mostly
# noise and makes the prefilter counts impossible to reason about.

companies:
- {ats: ashby, slug: aiprise, name: AiPrise}
- {ats: ashby, slug: bureau, name: Bureau}
- {ats: ashby, slug: certa, name: Certa}
- {ats: lever, slug: hevodata, name: Hevo Data}
- {ats: lever, slug: drivetrain, name: Drivetrain}
- {ats: greenhouse, slug: sigmoid, name: Sigmoid}
- {ats: greenhouse, slug: enterpret, name: Enterpret}
- {ats: lever, slug: merklescience, name: Merkle Science}
- {ats: greenhouse, slug: hackerrank, name: HackerRank}
- {ats: greenhouse, slug: stripe, name: Stripe}
- {ats: greenhouse, slug: instawork, name: Instawork}
- {ats: greenhouse, slug: superapp, name: SuperApp}
- {ats: ashby, slug: triomics, name: Triomics}
- {ats: ashby, slug: uipath, name: UiPath}
- {ats: greenhouse, slug: prodigal, name: Prodigal}